name: Upstream Refresh

on:
  workflow_dispatch:
    inputs:
      source_filter:
        description: Limit refresh to one source or use all
        required: false
        default: all
        type: string
      strategy_override:
        description: Optional run-scoped override for source resolution strategy
        required: false
        default: ''
        type: string
      allow_prerelease:
        description: Allow prerelease selection for this run only when supported by the strategy
        required: false
        default: false
        type: boolean
      validation_mode:
        description: Run on the checked-out workflow ref without switching to origin/dev; keeps lock persistence and PR creation disabled
        required: false
        default: false
        type: boolean
      create_pr:
        description: Create or update the upstream refresh pull request
        required: false
        default: false
        type: boolean
      dry_run:
        description: Resolve and verify without opening a pull request
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 12 * * 5'

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  upstream-refresh:
    name: Refresh upstream baselines
    if: ${{ github.event_name != 'schedule' || vars.UPSTREAM_REFRESH_SCHEDULE_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out workflow ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run upstream refresh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
          WRANGLER_HOME: ${{ runner.temp }}/wrangler
        run: node scripts/ci/run-upstream-refresh.mjs

      - name: Upload upstream refresh result
        if: ${{ always() && hashFiles('.harness/upstream-refresh-result.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: upstream-refresh-result
          path: .harness/upstream-refresh-result.json
          if-no-files-found: error

      - name: Read upstream refresh result
        id: refresh_result
        if: ${{ always() && hashFiles('.harness/upstream-refresh-result.json') != '' }}
        run: |
          node <<'NODE'
          const { readFileSync, appendFileSync } = require('node:fs');

          const result = JSON.parse(readFileSync('.harness/upstream-refresh-result.json', 'utf8'));
          const eligibleCount = Array.isArray(result.eligibleFiles) ? result.eligibleFiles.length : 0;
          appendFileSync(process.env.GITHUB_OUTPUT, `status=${result.status ?? ''}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `eligible_count=${eligibleCount}\n`);
          NODE

      - name: Open upstream refresh pull request
        if: ${{ success() && steps.refresh_result.outputs.status == 'success' && steps.refresh_result.outputs.eligible_count != '0' && (github.event_name == 'schedule' || (inputs.create_pr == true && inputs.dry_run != true && inputs.validation_mode != true)) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/open-upstream-pr.mjs
