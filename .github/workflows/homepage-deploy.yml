name: Deploy Homepage

on:
  push:
    branches:
      - main
    paths:
      - 'homepage/**'
      - '.github/workflows/homepage-deploy.yml'
      - 'docs/install/homepage-cloudflare-worker.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-homepage:
    if: ${{ github.repository == 'ilderaj/superpowering-with-files' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: homepage/package-lock.json

      - name: Install homepage dependencies
        run: npm ci --prefix homepage

      - name: Typecheck homepage
        run: npm run typecheck --prefix homepage

      - name: Test homepage
        run: npm test --prefix homepage

      - name: Build homepage
        run: npm run build --prefix homepage

      - name: Deploy homepage Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --prefix homepage wrangler deploy --config homepage/wrangler.jsonc

      - name: Smoke check production homepage
        run: |
          url="https://vibing.paymond.me/superpowering-with-files"
          for attempt in 1 2 3 4 5; do
            status=$(curl -sS -o /tmp/homepage-smoke.html -w "%{http_code}" -L --max-redirs 5 --connect-timeout 20 "$url")
            if [ "$status" = "200" ] && grep -q "<title>Superpowering with Files | Governance harness for coding agents</title>" /tmp/homepage-smoke.html; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 5
            fi
          done
          echo "Smoke check failed for $url"
          cat /tmp/homepage-smoke.html || true
          exit 1
